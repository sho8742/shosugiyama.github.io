<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t3title t3desc" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <title id="t3title">送迎の工程が時間で見える</title>
  <desc id="t3desc">出発・迎え・到着の時刻を一日の流れに沿って並べた送迎の工程表を、印刷して使える様子のイメージ図</desc>
  <defs>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#8a6f47" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/><stop offset="1" stop-color="#f1ede5"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" rx="16" fill="url(#b3)"/>

  <!-- 見出し -->
  <text x="44" y="56" font-size="20" font-weight="700" fill="#2c2c2c">送迎の工程を時間で組み立て</text>
  <text x="44" y="80" font-size="13.5" fill="#6b6b6b">出発・迎え・到着を、一日の流れで把握</text>

  <!-- パネル -->
  <g filter="url(#s3)">
    <rect x="44" y="104" width="392" height="186" rx="14" fill="#ffffff" stroke="#e7e1d6" stroke-width="1.5"/>
  </g>

  <!-- カード見出し -->
  <text x="74" y="140" font-size="13" font-weight="700" fill="#6b5638">ルート1 の工程表</text>
  <!-- 時計アイコン -->
  <g transform="translate(300,135)" stroke="#8a6f47" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="9"/><path d="M0 -5 V0 L4 3"/>
  </g>
  <!-- 印刷アイコン -->
  <g transform="translate(404,135)" stroke="#8a6f47" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-13" y="-4" width="26" height="15" rx="3" fill="#fff"/>
    <path d="M-8 -4 v-7 h16 v7"/>
    <rect x="-8" y="5" width="16" height="10" rx="2" fill="#efe7d8"/>
  </g>

  <!-- タイムライン -->
  <path d="M150 162 V272" stroke="#e3dccc" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 行1: 出発 -->
  <text x="132" y="166" font-size="12.5" font-weight="700" fill="#6b5638" text-anchor="end">8:30</text>
  <circle cx="150" cy="162" r="6.5" fill="#8a6f47"/><circle cx="150" cy="162" r="2.6" fill="#fff"/>
  <text x="168" y="166" font-size="12.5" fill="#3f3f3f">事業所を出発</text>

  <!-- 行2: 迎え1 -->
  <text x="132" y="202" font-size="12.5" font-weight="700" fill="#6b5638" text-anchor="end">8:50</text>
  <circle cx="150" cy="198" r="6.5" fill="#8a6f47"/><circle cx="150" cy="198" r="2.6" fill="#fff"/>
  <text x="168" y="202" font-size="12.5" fill="#3f3f3f">お迎え ①</text>

  <!-- 行3: 迎え2 -->
  <text x="132" y="238" font-size="12.5" font-weight="700" fill="#6b5638" text-anchor="end">9:10</text>
  <circle cx="150" cy="234" r="6.5" fill="#8a6f47"/><circle cx="150" cy="234" r="2.6" fill="#fff"/>
  <text x="168" y="238" font-size="12.5" fill="#3f3f3f">お迎え ②</text>

  <!-- 行4: 到着 -->
  <text x="132" y="276" font-size="12.5" font-weight="700" fill="#6b5638" text-anchor="end">9:30</text>
  <g transform="translate(150,272)">
    <circle r="6.5" fill="#6b5638"/>
    <path d="M-2.6 0 l2 2 l3.4 -3.8" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="168" y="276" font-size="12.5" fill="#3f3f3f">事業所に到着</text>

  <!-- 送迎車（タイムライン中ほど） -->
  <g transform="translate(360,216)">
    <rect x="-24" y="-12" width="48" height="20" rx="7" fill="#ffffff" stroke="#8a6f47" stroke-width="2.2"/>
    <path d="M-24 -3 h48" stroke="#8a6f47" stroke-width="1.8"/>
    <rect x="-19" y="-9" width="12" height="8" rx="2" fill="#efe7d8"/>
    <circle cx="-13" cy="9" r="4.5" fill="#6b5638"/><circle cx="13" cy="9" r="4.5" fill="#6b5638"/>
  </g>
</svg>
