<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="flowTitle flowDesc" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <title id="flowTitle">記録が一度でつながる</title>
  <desc id="flowDesc">日々の記録が、実績記録や請求・報酬の見込みまで自動でつながる流れを示した概念図</desc>

  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#8a6f47" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#f1ede5"/>
    </linearGradient>
    <linearGradient id="head1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b805a"/>
      <stop offset="1" stop-color="#8a6f47"/>
    </linearGradient>
    <linearGradient id="head3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a6240"/>
      <stop offset="1" stop-color="#6b5638"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="960" height="440" fill="url(#bg)"/>

  <!-- 見出し -->
  <text x="480" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#2c2c2c">記録は一度の入力で、必要な書類までつながる</text>
  <text x="480" y="82" text-anchor="middle" font-size="15" fill="#6b6b6b">同じ数字を、何度も書き写す必要はありません</text>

  <!-- つながりを示す下地の曲線（福祉の手のひらのように下から支える） -->
  <path d="M70 360 C 300 300, 660 300, 890 360" fill="none" stroke="#8a6f47" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
  <path d="M70 360 C 300 300, 660 300, 890 360" fill="none" stroke="#8a6f47" stroke-opacity="0.10" stroke-width="14" stroke-linecap="round"/>

  <!-- ===== ステージ1: 日々の記録 ===== -->
  <g filter="url(#soft)">
    <rect x="70" y="120" width="236" height="186" rx="18" fill="#ffffff" stroke="#e7e1d6" stroke-width="1.5"/>
  </g>
  <circle cx="188" cy="168" r="34" fill="url(#head1)"/>
  <!-- アイコン: クリップボード + チェック -->
  <g stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="174" y="153" width="28" height="32" rx="4" fill="none"/>
    <rect x="182" y="149" width="12" height="7" rx="2" fill="#ffffff" stroke="none"/>
    <path d="M179 166 l4 4 l8 -9"/>
    <path d="M179 176 h18" stroke-opacity="0.7"/>
  </g>
  <text x="188" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2c2c">日々の記録</text>
  <text x="188" y="260" text-anchor="middle" font-size="14" fill="#555">通所・出欠・支援・送迎</text>
  <text x="188" y="286" text-anchor="middle" font-size="12.5" fill="#9a8e7a">その場で自動保存</text>

  <!-- 矢印1 -->
  <path d="M312 213 h26" stroke="#8a6f47" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M338 213 l-9 -6 v12 z" fill="#8a6f47"/>

  <!-- ===== ステージ2: 自動でまとまる ===== -->
  <g filter="url(#soft)">
    <rect x="362" y="120" width="236" height="186" rx="18" fill="#ffffff" stroke="#e7e1d6" stroke-width="1.5"/>
  </g>
  <circle cx="480" cy="168" r="34" fill="url(#head1)"/>
  <!-- アイコン: 循環矢印 -->
  <g stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M468 162 a14 14 0 0 1 24 -4"/>
    <path d="M492 150 v9 h-9"/>
    <path d="M492 174 a14 14 0 0 1 -24 4"/>
    <path d="M468 186 v-9 h9"/>
  </g>
  <text x="480" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2c2c">自動でまとまる</text>
  <text x="480" y="260" text-anchor="middle" font-size="14" fill="#555">実績記録・工賃・各種書類</text>
  <text x="480" y="286" text-anchor="middle" font-size="12.5" fill="#9a8e7a">転記・二度打ちなし</text>

  <!-- 矢印2 -->
  <path d="M604 213 h26" stroke="#8a6f47" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M630 213 l-9 -6 v12 z" fill="#8a6f47"/>

  <!-- ===== ステージ3: 見通しが立つ ===== -->
  <g filter="url(#soft)">
    <rect x="654" y="120" width="236" height="186" rx="18" fill="#ffffff" stroke="#e7e1d6" stroke-width="1.5"/>
  </g>
  <circle cx="772" cy="168" r="34" fill="url(#head3)"/>
  <!-- アイコン: 棒グラフ＋上向き -->
  <g stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M760 182 v-8"/>
    <path d="M770 182 v-16"/>
    <path d="M780 182 v-24"/>
    <path d="M758 156 l8 -8 l6 4 l9 -10"/>
  </g>
  <text x="772" y="232" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2c2c">見通しが立つ</text>
  <text x="772" y="260" text-anchor="middle" font-size="14" fill="#555">請求の元資料・報酬の見込み</text>
  <text x="772" y="286" text-anchor="middle" font-size="12.5" fill="#9a8e7a">月次・年度で把握</text>

  <!-- タグライン -->
  <text x="480" y="404" text-anchor="middle" font-size="14" fill="#8a6f47" letter-spacing="0.06em">現場に寄り添う、福祉の手。</text>
</svg>
