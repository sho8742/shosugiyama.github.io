<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t1title t1desc" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <title id="t1title">記録が一度で済む</title>
  <desc id="t1desc">一度入力した記録が、複数の書類へ自動で引き継がれる様子のイメージ図</desc>
  <defs>
    <filter id="s1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#8a6f47" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/><stop offset="1" stop-color="#f1ede5"/>
    </linearGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b805a"/><stop offset="1" stop-color="#8a6f47"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" rx="16" fill="url(#b1)"/>

  <!-- 入力フォーム（1枚） -->
  <g filter="url(#s1)">
    <rect x="44" y="92" width="150" height="180" rx="14" fill="#ffffff" stroke="#e7e1d6" stroke-width="1.5"/>
  </g>
  <rect x="44" y="92" width="150" height="40" rx="14" fill="url(#h1)"/>
  <rect x="44" y="116" width="150" height="16" fill="#8a6f47"/>
  <text x="119" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">日々の記録</text>
  <g stroke="#c9bda6" stroke-width="2" stroke-linecap="round">
    <path d="M68 156 h102"/><path d="M68 178 h102"/><path d="M68 200 h102"/><path d="M68 222 h72"/>
  </g>
  <g stroke="#8a6f47" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="156" r="3"/><circle cx="60" cy="178" r="3"/><circle cx="60" cy="200" r="3"/>
  </g>

  <!-- 分岐コネクタ -->
  <g stroke="#8a6f47" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M194 150 C 250 150, 250 120, 300 120"/>
    <path d="M194 182 C 256 182, 256 182, 300 182"/>
    <path d="M194 214 C 250 214, 250 244, 300 244"/>
  </g>
  <g fill="#8a6f47">
    <path d="M300 120 l-10 -5 v10 z"/><path d="M300 182 l-10 -5 v10 z"/><path d="M300 244 l-10 -5 v10 z"/>
  </g>

  <!-- 出力ドキュメント（複数） -->
  <g filter="url(#s1)">
    <rect x="306" y="96" width="128" height="48" rx="10" fill="#ffffff" stroke="#e7e1d6" stroke-width="1.5"/>
    <rect x="306" y="158" width="128" height="48" rx="10" fill="#ffffff" stroke="#e7e1d6" stroke-width="1.5"/>
    <rect x="306" y="220" width="128" height="48" rx="10" fill="#ffffff" stroke="#e7e1d6" stroke-width="1.5"/>
  </g>
  <g font-size="13" fill="#5a4d39" font-weight="600">
    <text x="370" y="125" text-anchor="middle">実績記録</text>
    <text x="370" y="187" text-anchor="middle">工　賃</text>
    <text x="370" y="249" text-anchor="middle">請求の元資料</text>
  </g>
  <g fill="#8a6f47" opacity="0.85">
    <circle cx="322" cy="120" r="3.2"/><circle cx="322" cy="182" r="3.2"/><circle cx="322" cy="244" r="3.2"/>
  </g>

  <!-- 見出し -->
  <text x="44" y="56" font-size="20" font-weight="700" fill="#2c2c2c">記録は一度の入力で</text>
  <text x="44" y="80" font-size="13.5" fill="#6b6b6b">同じ数字を何度も書き写さない</text>
</svg>
