<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t5title t5desc" font-family="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">
  <title id="t5title">その日の職員の動きが一目でわかる</title>
  <desc id="t5desc">シフトと動向表で、各職員がその日いつ何をしているかを時間帯ごとに把握できる様子のイメージ図</desc>
  <defs>
    <filter id="s5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#8a6f47" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="b5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/><stop offset="1" stop-color="#f1ede5"/>
    </linearGradient>
    <linearGradient id="h5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b805a"/><stop offset="1" stop-color="#8a6f47"/>
    </linearGradient>
  </defs>
  <rect width="480" height="320" rx="16" fill="url(#b5)"/>

  <!-- 見出し -->
  <text x="44" y="52" font-size="20" font-weight="700" fill="#2c2c2c">その日の動きが一目でわかる</text>
  <text x="44" y="76" font-size="13.5" fill="#6b6b6b">誰が・いつ・何をしているか</text>

  <!-- 動向表パネル -->
  <g filter="url(#s5)">
    <rect x="44" y="96" width="392" height="172" rx="14" fill="#ffffff" stroke="#e7e1d6" stroke-width="1.5"/>
  </g>
  <!-- 左ラベル列の見出し帯 -->
  <rect x="44" y="96" width="392" height="30" rx="14" fill="url(#h5)"/>
  <rect x="44" y="110" width="392" height="16" fill="#8a6f47"/>
  <text x="80" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">職員</text>
  <!-- 時刻ラベル -->
  <g font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">
    <text x="138" y="116">9:00</text><text x="237" y="116">12:00</text><text x="336" y="116">15:00</text><text x="416" y="116">18:00</text>
  </g>

  <!-- 縦のうすいグリッド -->
  <g stroke="#efe9dc" stroke-width="1.4">
    <path d="M138 132 V258"/><path d="M237 132 V258"/><path d="M336 132 V258"/>
  </g>

  <!-- 行ラベル -->
  <g font-size="13" fill="#5a4d39" font-weight="600">
    <text x="58" y="153">職員A</text>
    <text x="58" y="183">職員B</text>
    <text x="58" y="213">職員C</text>
    <text x="58" y="243">職員D</text>
  </g>

  <!-- 活動ブロック（送迎=accent / 支援=light / 休憩=gray） -->
  <!-- 職員A -->
  <g>
    <rect x="122" y="142" width="33" height="18" rx="4" fill="#8a6f47"/>
    <rect x="158" y="142" width="159" height="18" rx="4" fill="#c2a878"/>
    <rect x="320" y="142" width="33" height="18" rx="4" fill="#8a6f47"/>
  </g>
  <!-- 職員B -->
  <g>
    <rect x="122" y="172" width="96" height="18" rx="4" fill="#c2a878"/>
    <rect x="221" y="172" width="30" height="18" rx="4" fill="#d8d2c6"/>
    <rect x="254" y="172" width="129" height="18" rx="4" fill="#c2a878"/>
  </g>
  <!-- 職員C -->
  <g>
    <rect x="122" y="202" width="33" height="18" rx="4" fill="#8a6f47"/>
    <rect x="158" y="202" width="93" height="18" rx="4" fill="#c2a878"/>
    <rect x="254" y="202" width="30" height="18" rx="4" fill="#d8d2c6"/>
    <rect x="287" y="202" width="96" height="18" rx="4" fill="#c2a878"/>
  </g>
  <!-- 職員D -->
  <g>
    <rect x="122" y="232" width="96" height="18" rx="4" fill="#c2a878"/>
    <rect x="221" y="232" width="33" height="18" rx="4" fill="#8a6f47"/>
    <rect x="257" y="232" width="126" height="18" rx="4" fill="#c2a878"/>
  </g>

  <!-- 凡例 -->
  <g font-size="11.5" fill="#6b6b6b">
    <rect x="44" y="286" width="14" height="12" rx="3" fill="#8a6f47"/><text x="64" y="296">送迎</text>
    <rect x="110" y="286" width="14" height="12" rx="3" fill="#c2a878"/><text x="130" y="296">支援</text>
    <rect x="176" y="286" width="14" height="12" rx="3" fill="#d8d2c6"/><text x="196" y="296">休憩</text>
  </g>
</svg>
